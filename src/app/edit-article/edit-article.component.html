<app-header></app-header>
<app-sidebar></app-sidebar>
<p-toast></p-toast>

<div class="page-wrapper">
  <div class="content">
    <!-- Premium Header Section -->
    <div class="edit-header-section">
      <div class="header-top-bar">
        <div class="add-item">
          <div class="page-title">
            <h2 class="header-title">Modifier un produit</h2>
            <p class="header-subtitle">Mettre à jour le produit existant</p>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-icon-header" data-bs-toggle="tooltip" data-bs-placement="top" title="Rafraîchir" (click)="refreshArticles()">
            <i class="ti ti-refresh"></i>
          </button>
          <a href="articles" class="btn btn-header-back">
            <i data-feather="arrow-left" class="me-2"></i>Retour à la liste
          </a>
        </div>
      </div>
    </div>
    <form action="update-product.html" class="add-product-form">
      <div class="add-product">
        <!-- Article Info Section -->
        <div class="form-card">
          <div class="form-card-header">
            <h3 class="card-title">Informations sur l'article</h3>
          </div>
          <div class="form-card-body">
            <!-- Language Tabs -->
            <div class="form-section-tabs">
              <ul class="form-tabs-list">
                <li *ngFor="let lang of languages" class="form-tab-item">
                  <button 
                    class="form-tab-btn"
                    [class.active]="currentLanguageId === lang.id"
                    (click)="onLanguageTabClick(lang.id)"
                    type="button">
                    <img *ngIf="lang.id === 1" src="assets/img/flags/fr.png" alt="France" class="tab-flag" />
                    <img *ngIf="lang.id === 2" src="assets/img/flags/us.png" alt="England" class="tab-flag" />
                    <img *ngIf="lang.id === 3" src="assets/img/flags/es.png" alt="Spain" class="tab-flag" />
                    <span>{{ lang.name }}</span>
                  </button>
                </li>
              </ul>
            </div>

            <div class="form-row">
              <div class="form-col">
                <div class="form-group">
                  <label class="form-label">Titre ({{ getLanguageName(currentLanguageId) }})<span class="text-danger ms-1">*</span></label>
                  <div class="input-group-wrapper">
                    <input type="text" class="form-control-modern" [(ngModel)]="articleTitle" name="articleTitle" placeholder="Entrez le titre">
                    <button type="button" class="btn-generate" (click)="generateTitleFromContent()" [disabled]="!text || !text.trim()">
                      <i class="ti ti-bulb"></i> Générer
                    </button>
                  </div>
                </div>
              </div>
              <div class="form-col">
                <div class="form-group">
                  <label class="form-label">Catégorie<span class="text-danger ms-1">*</span></label>
                  <div class="input-with-addon">
                    <p-dropdown 
                      [options]="categories" 
                      [(ngModel)]="selectedCategory"
                      [ngModelOptions]="{standalone: true}"
                      optionLabel="name" 
                      optionValue="id"
                      [showClear]="true"
                      placeholder="Sélectionnez une catégorie"
                      name="category"
                      appendTo="body"
                      [virtualScroll]="true"
                      [filter]="true"
                      [dropdownIcon]="'pi pi-chevron-down'"
                      [autoDisplayFirst]="false"
                      styleClass="w-100"
                    >
                    </p-dropdown>
                    <a href="categories" class="btn-addon-action" title="Ajouter une catégorie">
                      <i data-feather="plus-circle"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-full-width">
              <div class="form-group">
                <label class="form-label">Description ({{ getLanguageName(currentLanguageId) }})<span class="text-danger ms-1">*</span></label>
                <div class="editor-container">
                  <p-editor
                    [(ngModel)]="text"
                    name="articleDescription"
                    [style]="{height:'250px'}"
                    [modules]="{
                      toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        ['blockquote', 'code-block'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link'],
                        ['clean']
                      ]
                    }"
                    placeholder="Saisissez la description ici..."
                    [ngModelOptions]="{standalone: true}"
                  ></p-editor>
                </div>
                <small class="form-help-text">Maximum 200 mots</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Product Details Section -->
        <div class="form-card">
          <div class="form-card-header">
            <h3 class="card-title">Détails du produit</h3>
          </div>
          <div class="form-card-body">
            <!-- Article Types -->
            <div class="form-group">
              <label class="form-label">Types d'article</label>
              <div class="checkbox-group">
                <div class="checkbox-item" *ngFor="let type of articleTypes; trackBy: trackById">
                  <input class="form-check-input" type="checkbox" 
                    [id]="'type-' + type.id" 
                    [(ngModel)]="type.model" 
                    [name]="'type-' + type.id" 
                    (change)="onCheckboxChange(type)">
                  <label class="form-check-label" [for]="'type-' + type.id">{{ type.type }}</label>
                </div>
              </div>
            </div>

            <!-- Access Type -->
            <div class="form-group">
              <label class="form-label">Accès au produit<span class="text-danger ms-1">*</span></label>
              <div class="radio-group">
                <div class="radio-item">
                  <input class="form-check-input" type="radio" name="accessType" id="gratuitAccess" [(ngModel)]="accessType" value="gratuit" [checked]="accessType === 'gratuit' || !accessType">
                  <label class="form-check-label" for="gratuitAccess">
                    <i class="ti ti-gift"></i> Gratuit
                  </label>
                </div>
                <div class="radio-item">
                  <input class="form-check-input" type="radio" name="accessType" id="payantAccess" [(ngModel)]="accessType" value="payant">
                  <label class="form-check-label" for="payantAccess">
                    <i class="ti ti-coin"></i> Payant
                  </label>
                </div>
              </div>
            </div>

            <!-- Tags -->
            <div class="form-group">
              <label class="form-label">Tags<span class="text-danger ms-1">*</span></label>
              <div class="input-with-addon">
                <p-multiSelect
                  [options]="availableTags"
                  [(ngModel)]="articleTags"
                  [ngModelOptions]="{standalone: true}"
                  optionLabel="name"
                  optionValue="id"
                  [showClear]="true"
                  placeholder="Sélectionnez des tags"
                  name="articleTags"
                  (onChange)="onTagsChange()"
                  display="chip"
                  appendTo="body"
                  [filter]="true"
                  [selectedItemsLabel]="'Tags sélectionnés'"
                  styleClass="w-100"
                ></p-multiSelect>
                <a href="tags" class="btn-addon-action" title="Ajouter des tags">
                  <i data-feather="plus-circle"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Images Section -->
        <div class="form-card">
          <div class="form-card-header">
            <h3 class="card-title">Galerie média</h3>
          </div>
          <div class="form-card-body">
            <!-- Upload Area -->
            <div class="form-group">
              <div class="media-upload-zone">
                <input type="file" multiple accept="image/*,video/*" (change)="onMediaSelected($event)" class="media-input-hidden" #fileInput>
                <div class="upload-zone-content" (click)="fileInput.click()">
                  <i class="ti ti-cloud-upload"></i>
                  <h5>Ajouter des images ou vidéos</h5>
                  <p>Glissez-déposez ou cliquez pour sélectionner</p>
                </div>
              </div>
            </div>

            <!-- Media Gallery -->
            <div *ngIf="mediaPreviews.length > 0" class="media-gallery">
              <label class="form-label">Médias téléchargés</label>
              <div class="gallery-grid">
                <div class="gallery-item" *ngFor="let media of mediaPreviews; let i = index">
                  <div class="gallery-item-container">
                    <ng-container [ngSwitch]="media.type">
                      <img *ngSwitchCase="'image'" [src]="media.url" alt="image" class="gallery-media" (click)="viewMedia(media)" />
                      <video *ngSwitchCase="'video'" [src]="media.url" class="gallery-media" (click)="viewMedia(media)"></video>
                    </ng-container>
                    <button type="button" class="btn-delete-media" (click)="removeMedia(i)" title="Supprimer">
                      <i class="ti ti-x"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button type="button" (click)="annulerArticle()" class="btn-action-cancel">
            <i class="ti ti-x"></i> Annuler
          </button>
          <button type="submit" (click)="addArticle()" class="btn-action-submit">
            <i class="ti ti-check"></i> Mettre à jour le produit
          </button>
        </div>
      </div>
    </form>
  </div>
  <app-footer></app-footer>
</div>

<!-- View Media Modal -->
<div class="modal fade" id="add-product-category">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-premium">
      <div class="modal-header">
        <h5 class="modal-title">Voir le média</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <ng-container *ngIf="selectedMediaToView">
          <img *ngIf="selectedMediaToView.type === 'image'" [src]="selectedMediaToView.url" alt="image" class="modal-media">
          <video *ngIf="selectedMediaToView.type === 'video'" [src]="selectedMediaToView.url" controls class="modal-media"></video>
        </ng-container>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-action cancel" data-bs-dismiss="modal">Fermer</button>
        <button type="button" class="btn-modal-action submit" data-bs-dismiss="modal">
          <i class="ti ti-download"></i> Télécharger
        </button>
      </div>
    </div>
  </div>
</div>
