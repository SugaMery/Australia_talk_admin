<app-header></app-header>
<app-sidebar></app-sidebar>
<p-toast></p-toast>

<div class="page-wrapper">
  <div class="content">
    <div class="page-header">
      <div class="add-item d-flex">
        <div class="page-title">
          <h4 class="fw-bold">Créer une Newsletter</h4>
          <h6>Composez et envoyez une nouvelle newsletter</h6>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Informations de la Newsletter</h5>
          </div>
          <div class="card-body">
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label">Titre de la Newsletter <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="Ex: Actualités du mois"
                [(ngModel)]="newsletter.title">
            </div>

            <!-- Subject -->
            <div class="mb-3">
              <label class="form-label">Sujet de l'email <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="Objet qui apparaîtra dans la boîte de réception"
                [(ngModel)]="newsletter.subject">
            </div>

            <!-- Content -->
            <div class="mb-3">
              <label class="form-label">Contenu <span class="text-danger">*</span></label>
              <textarea 
                class="form-control" 
                rows="10"
                placeholder="Rédigez le contenu de votre newsletter"
                [(ngModel)]="newsletter.content"
                style="min-height: 300px;"></textarea>
            </div>

            <!-- Status -->
            <div class="mb-3">
              <label class="form-label">Statut</label>
              <select class="form-select" [(ngModel)]="newsletter.status">
                <option value="draft">Brouillon</option>
                <option value="scheduled">Programmé</option>
                <option value="ready">Prêt à envoyer</option>
              </select>
            </div>

            <!-- Scheduled Date (if status is scheduled) -->
            <div class="mb-3" *ngIf="newsletter.status === 'scheduled'">
              <label class="form-label">Date et heure d'envoi</label>
              <input 
                type="datetime-local" 
                class="form-control"
                [(ngModel)]="newsletter.scheduled_date">
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-4">
        <!-- Recipients -->
        <div class="card mb-3">
          <div class="card-header">
            <h5 class="card-title">Destinataires</h5>
          </div>
          <div class="card-body">
            <label class="form-label">Sélectionner les destinataires</label>
            <select class="form-select" [(ngModel)]="newsletter.recipients" multiple>
              <option value="all">Tous les abonnés</option>
              <option value="active">Abonnés actifs</option>
              <option value="inactive">Abonnés inactifs</option>
              <option value="segment1">Segment personnalisé 1</option>
            </select>
            <small class="text-muted d-block mt-2">
              Maintenez Ctrl (Cmd sur Mac) pour sélectionner plusieurs options
            </small>
          </div>
        </div>

        <!-- Actions -->
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Actions</h5>
          </div>
          <div class="card-body d-grid gap-2">
            <button 
              class="btn btn-warning" 
              (click)="sendPreview()"
              [disabled]="loading">
              <i class="ti ti-mail me-1"></i>Envoyer un aperçu
            </button>
            <button 
              class="btn btn-secondary" 
              (click)="resetForm()">
              <i class="ti ti-refresh me-1"></i>Réinitialiser
            </button>
            <button 
              class="btn btn-primary" 
              (click)="saveNewsletter()"
              [disabled]="loading">
              <i *ngIf="!loading" class="ti ti-check me-1"></i>
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
          </div>
        </div>

        <!-- Preview -->
        <div class="card mt-3">
          <div class="card-header">
            <h5 class="card-title">Aperçu</h5>
          </div>
          <div class="card-body">
            <div class="preview-box">
              <div class="preview-header">
                <strong>Sujet:</strong> {{ newsletter.subject || 'Non défini' }}
              </div>
              <div class="preview-content">
                {{ newsletter.content || 'Contenu non défini' }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
